name: deliverance_scout
description: "Deliverance scout agent that runs on an office device and reports its health."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  flutter_secure_storage: ^11.2.0
  signalr_flutter: ^0.2.1
  signalr_netcore: ^1.4.4
  jwt_decoder: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  fonts:
    - family: Abel
      fonts:
        - asset: assets/font/Abel-Regular.ttf

