name: deliverance_mobile
description: "Deliverance mobile app for reporting problems with office devices."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  json_annotation: ^4.12.0
  jwt_decoder: ^2.0.1
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.2.3
  easy_stepper: ^1.2.0
  flutter_ruler_slider: ^0.0.7
  flutter_svg: ^2.3.0
  multi_dropdown: ^3.2.2
  intl: ^0.20.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Abel
      fonts:
        - asset: assets/font/Abel-Regular.ttf

