name: deliverance_desktop
description: "Deliverance admin app for Windows: reports, offices, devices and scouts."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  flutter_secure_storage: ^11.0.0
  jwt_decoder: ^2.0.1
  provider: ^6.1.5+1
  font_awesome_flutter: ^11.0.0
  json_annotation: ^4.12.0
  flutter_svg: ^2.3.0
  http: ^1.6.0
  fl_chart: ^1.2.0
  intl: ^0.20.3
  month_year_picker: ^0.5.0+1
  signalr_netcore: ^1.4.4
  simple_typing_indicator: ^1.0.1
  printing: ^5.15.1
  file_picker: ^13.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Abel
      fonts:
        - asset: assets/font/Abel-Regular.ttf

