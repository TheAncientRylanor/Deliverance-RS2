version: "3.8"

services:
  deliverance-2026:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: deliverance-2026
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: qweasd123!
    ports:
      - "1435:1433"
    expose:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: deliverance-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  ollama:
    build: ./ollama
    container_name: deliverance-ollama
    environment:
      OLLAMA_KEEP_ALIVE: 1h # keep the model loaded between questions
    ports:
      - "11434:11434"

volumes:
  sqlserver_data:
  rabbitmq_data:
